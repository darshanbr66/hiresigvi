# Response security headers. Install to
# /etc/nginx/snippets/zphirex-security-headers.conf.
#
# nginx drops every inherited `add_header` in a block that declares its own,
# so each location in zphirex.conf that adds a header (e.g. Cache-Control)
# includes this file again rather than relying on the server-level copy.
#
# HSTS deliberately omits `includeSubDomains`/`preload`: those would bind
# every current and future subdomain to HTTPS, which is a separate decision.
# A Content-Security-Policy is not set yet — index.html carries an inline
# theme script, so a CSP needs its own review (docs/deployment-vps.md § 13).

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# camera/microphone stay allowed for this origin: assessment proctoring
# requests both (frontend/src/features/careers/AssessmentTakingPage.tsx).
# X-Frame-Options DENY only stops OTHER sites framing these pages; the app's
# own previews use blob:/srcdoc iframes, which it does not affect.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
