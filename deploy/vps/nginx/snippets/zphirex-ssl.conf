# TLS settings shared by every HTTPS server block in zphirex.conf.
# Install to /etc/nginx/snippets/zphirex-ssl.conf.
#
# One certificate covers zphirex.com, www.zphirex.com and api.zphirex.com
# (issued together — docs/deployment-vps.md § 6), so all blocks share it.
# Written out here rather than including certbot's options-ssl-nginx.conf,
# which only exists when certbot's nginx plugin (not webroot mode) is used.

ssl_certificate     /etc/letsencrypt/live/zphirex.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/zphirex.com/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:ZphirexSSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
