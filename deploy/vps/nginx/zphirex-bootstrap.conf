# Zphirex — TEMPORARY HTTP-only site, used once to obtain the first
# Let's Encrypt certificate (docs/deployment-vps.md § 6).
#
# The full config (zphirex.conf) refers to certificate files that do not
# exist yet, so `nginx -t` would reject it before the first issuance. Enable
# this file, run certbot (webroot mode), then replace it with zphirex.conf.
#
#   sudo cp deploy/vps/nginx/zphirex-bootstrap.conf /etc/nginx/sites-available/zphirex.conf
#   sudo ln -sf /etc/nginx/sites-available/zphirex.conf /etc/nginx/sites-enabled/zphirex.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name zphirex.com www.zphirex.com api.zphirex.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 404;
    }
}
