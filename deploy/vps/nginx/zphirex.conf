# Zphirex — production nginx site (Ubuntu 24.04, nginx 1.24).
#
#   https://zphirex.com       React SPA (static files uploaded via FileZilla)
#   https://www.zphirex.com   301 -> https://zphirex.com
#   https://api.zphirex.com   FastAPI (uvicorn on 127.0.0.1:8000, systemd)
#
# Install (docs/deployment-vps.md § 6):
#   sudo cp deploy/vps/nginx/snippets/*.conf /etc/nginx/snippets/
#   sudo cp deploy/vps/nginx/zphirex.conf /etc/nginx/sites-available/zphirex.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx 1.24 note: HTTP/2 is enabled with `listen ... ssl http2` — the
# separate `http2 on;` directive only exists from nginx 1.25.1.

# --- Reject requests for any other host name (e.g. the bare VPS IP) -------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

# --- HTTP: ACME renewals + redirect everything else to HTTPS ---------------
server {
    listen 80;
    listen [::]:80;
    server_name zphirex.com www.zphirex.com api.zphirex.com;

    # certbot (webroot mode) renews through this path.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- www -> apex -----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zphirex.com;

    include snippets/zphirex-ssl.conf;
    include snippets/zphirex-security-headers.conf;

    return 301 https://zphirex.com$request_uri;
}

# --- Frontend: React SPA ---------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zphirex.com;

    include snippets/zphirex-ssl.conf;
    include snippets/zphirex-security-headers.conf;

    # Contents of frontend/dist/ are uploaded here (FileZilla).
    root /var/www/zphirex/html;
    index index.html;

    access_log /var/log/nginx/zphirex.access.log;
    error_log  /var/log/nginx/zphirex.error.log;

    # Vite's hashed bundles: a changed file always gets a new name, so they
    # can be cached forever. A missing asset is a real 404, never index.html
    # (serving HTML for a .js URL breaks the page with a MIME error).
    location /assets/ {
        try_files $uri =404;
        include snippets/zphirex-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html must never be cached: it names the current hashed bundles,
    # and a stale copy would request files a new upload has replaced.
    location = /index.html {
        include snippets/zphirex-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # BrowserRouter: every client-side route (/recruiter/jobs,
    # /assessment/<token>, ...) is served index.html so a page refresh or a
    # shared link works. Real files (favicons) are served directly.
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# --- Backend API -----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.zphirex.com;

    include snippets/zphirex-ssl.conf;
    include snippets/zphirex-security-headers.conf;

    access_log /var/log/nginx/zphirex-api.access.log;
    error_log  /var/log/nginx/zphirex-api.error.log;

    # Resume uploads are capped at 10 MB by the API (MAX_RESUME_SIZE_MB);
    # this leaves room for multipart overhead and the other form fields.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE, never append ($proxy_add_x_forwarded_for): the API's
        # per-client rate limits read the first X-Forwarded-For entry
        # (backend/app/core/rate_limit.py), which a caller could otherwise
        # forge by sending their own header.
        proxy_set_header X-Forwarded-For $remote_addr;

        # AI screening / assistant calls can take 30-45 s upstream.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
