<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HireZ — one workspace for job postings, screening, assessments, interviews and campus hiring programs."
    />
    <title>HireZ</title>
    <script>
      // Apply a saved theme choice before first paint, so the startup screen
      // (and the first frame of the app) use it. Same key and values as
      // features/theme/ThemeContext.tsx, which takes over once React runs.
      try {
        var savedTheme = localStorage.getItem("ai-recruitment-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.setAttribute("data-theme", savedTheme);
        }
      } catch (e) {}
    </script>
    <style>
      /* Layout only, so the startup screen never shows as unstyled text
         before the stylesheet (styles/loading.css) arrives in development. */
      :where(#brand-loading) {
        position: fixed;
        inset: 0;
        z-index: 1000;
      }
      :where(#brand-loading) > span {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <!-- HireZ startup screen: shown until the first real screen is ready,
         then faded out and removed (src/shared/lib/brandLoading.ts). The
         ring rotates around the Z; the Z is its own layer and never moves. -->
    <div id="brand-loading" class="brand-loading" role="status" aria-label="Loading HireZ">
      <span class="brand-loading-mark" aria-hidden="true">
        <span class="brand-loading-ring"></span>
        <span class="brand-loading-z">Z</span>
      </span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
