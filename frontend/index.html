<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zodiac Patent's official site icon (the zodiacpatent.com favicon set, unaltered) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/zodiac-patent-icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/zodiac-patent-icon-192.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/zodiac-patent-icon-180.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ZPHIREX — careers at Zodiac Patent: full-time jobs, internships, Zodiac Training Academy, campus recruitment, scholarships and trainee programs."
    />
    <title>ZPHIREX — Careers at Zodiac Patent</title>
    <script>
      // Apply a saved theme choice before first paint, so the startup screen
      // (and the first frame of the app) use it. Same key and values as
      // features/theme/ThemeContext.tsx, which takes over once React runs.
      try {
        var savedTheme = localStorage.getItem("ai-recruitment-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.setAttribute("data-theme", savedTheme);
        }
      } catch (e) {}
    </script>
    <style>
      /* Layout only, so the startup screen never shows as unstyled text
         before the stylesheet (styles/loading.css) arrives in development. */
      :where(#brand-loading) {
        position: fixed;
        inset: 0;
        z-index: 1000;
      }
      :where(#brand-loading) > span {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <!-- Startup screen: shown until the first real screen is ready,
         then faded out and removed (src/shared/lib/brandLoading.ts). The
         ring rotates around the Z; the Z is its own layer and never moves. -->
    <div id="brand-loading" class="brand-loading" role="status" aria-label="Loading">
      <span class="brand-loading-mark" aria-hidden="true">
        <span class="brand-loading-ring"></span>
        <span class="brand-loading-z">Z</span>
      </span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
