# Render Blueprint for the SIGVITAS recruitment platform backend.
#
# This provisions the FastAPI web service only. The Postgres database is
# created separately (Render's managed Postgres, with pgvector enabled) per
# docs/deployment.md — a Blueprint-managed `databases:` entry is deliberately
# NOT used here so the connection string can be reviewed/rewritten to the
# `postgresql+psycopg://` scheme this app requires before it's wired in (see
# docs/deployment.md § "Database URL scheme").
#
# Apply via the Render dashboard: New -> Blueprint -> point at this repo.
# Every `sync: false` value must be filled in manually in the Render
# dashboard after the service is created — nothing sensitive lives in this
# file (CLAUDE.md: never commit secrets).

services:
  - type: web
    name: sigvitas-recruitment-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install --upgrade pip && pip install ."
    # `alembic upgrade head` runs first, using the exact same DATABASE_URL
    # env var the app itself reads (no new credentials, no second database,
    # no Base.metadata.create_all()) — the standard Render/Heroku "release
    # phase" pattern for a free tier with no Shell access. `&&` means
    # uvicorn only starts if migrations succeed, so a bad migration fails
    # the deploy loudly instead of serving against a stale schema; Render
    # then keeps the previous successful deploy live rather than taking the
    # service down. Idempotent by construction (alembic tracks the applied
    # revision in alembic_version; re-running at head is a fast no-op) —
    # safe to run on every cold start a free-tier dyno does after idling.
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      # Production resume-file storage: MongoDB GridFS, not local disk
      # (Render's default web-service filesystem is ephemeral — see
      # docs/deployment.md § 11).
      - key: RESUME_STORAGE_PROVIDER
        value: mongodb_gridfs
      - key: RESUME_STORAGE_DIR
        value: uploads/resumes
      - key: MAX_RESUME_SIZE_MB
        value: "10"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: ai_recruitment
      # Optional integrations — the app runs correctly with these unset
      # (email/AI screening report "not configured" rather than failing).
      # Outbound email. PRODUCTION uses Resend over HTTPS: set RESEND_API_KEY
      # and EMAIL_FROM below (Render's free web services block outbound SMTP
      # ports 25/465/587, so the SMTP_* variables cannot work there). Resend is
      # preferred whenever both are configured. SMTP_* is kept for local
      # development. Every secret is filled in the Render dashboard only —
      # never in this file.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: AI Recruitment Platform
      - key: SMTP_USE_TLS
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: llama3.1
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Sigvi, the public AI assistant (docs/sigvi.md). Set GEMINI_API_KEY in
      # the Render dashboard; without it the assistant reports "temporarily
      # unavailable" and nothing else is affected. The SIGVI_* tuning
      # variables are optional (defaults in app/core/config.py).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # Resume screening's own model, pinned explicitly rather than left to
      # the code default (app/core/config.py). This pair is the empirically
      # verified working configuration: gemini-3.5-flash-lite returned
      # sustained 503 "high demand" for screening, and gemini-2.5-flash
      # thinks by default with thinking tokens counted against
      # maxOutputTokens — which truncated the JSON verdict — hence budget 0.
      # Pinned here so a future change to the code default cannot silently
      # move production off the model that was verified against the real API.
      - key: GEMINI_SCREENING_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_SCREENING_THINKING_BUDGET
        value: "0"
      # Groq — the primary resume screening provider, with Gemini above as
      # the single fallback attempt (docs/ai-screening.md). Set GROQ_API_KEY
      # in the Render dashboard only; it is a backend-only secret.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_SCREENING_MODEL
        value: openai/gpt-oss-120b
      - key: AI_SCREENING_PROVIDER
        value: groq
      # Read by the candidate-intake migration (b4c5d6e7f8a9) when it
      # normalizes *existing* production phone numbers to E.164, as well as at
      # runtime. A data migration must not depend on an implicit default:
      # a different region would canonicalize stored numbers differently.
      - key: DEFAULT_PHONE_REGION
        value: IN
